name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run checks
        run: node tests/check.js

      - name: Format check (Prettier)
        run: npx --yes prettier@3 --check "js/*.js" "tests/*.js"

      - name: Minify verification (esbuild)
        run: |
          npm install --no-save esbuild >/dev/null 2>&1
          npx esbuild js/chatbot.js js/portfolio-render.js js/portfolio-data.js js/github-widgets.js js/id-card.js js/contact-form.js js/ui-upgrade.js js/admin.js --minify --outdir=/tmp/min >/dev/null && echo "✓ all JS minifies cleanly"
