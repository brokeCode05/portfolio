  <text x="400" y="435" font-family="monospace" font-size="9" fill="#6B7280" text-anchor="middle">CISCO NETACAD</text>
  <text x="720" y="460" font-family="monospace" font-size="9" fill="#4ADE80" text-anchor="end">[VERIFIED]</text>
  <defs>
