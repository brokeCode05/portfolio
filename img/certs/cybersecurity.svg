<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560">
  <rect width="800" height="560" rx="8" fill="#0F1115"/>
  <rect x="0" y="0" width="800" height="32" rx="8" fill="#1A1D27"/>
  <rect x="0" y="16" width="800" height="16" fill="#1A1D27"/>
  <text x="20" y="22" font-family="monospace" font-size="12" fill="#6B7280">●</text>
  <text x="36" y="22" font-family="monospace" font-size="12" fill="#F59E0B">●</text>
  <text x="52" y="22" font-family="monospace" font-size="12" fill="#4ADE80">●</text>
  <text x="360" y="22" font-family="monospace" font-size="11" fill="#6B7280">~/certificates/cybersecurity</text>
