  <text x="400" y="170" font-family="monospace" font-size="24" fill="#4ADE80" text-anchor="middle">🛡</text>
  <text x="400" y="200" font-family="monospace" font-size="14" fill="#4ADE80" text-anchor="middle">INTRODUCTION TO CYBERSECURITY</text>
