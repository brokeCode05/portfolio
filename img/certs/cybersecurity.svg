  <line x1="200" y1="245" x2="600" y2="245" stroke="#4ADE80" stroke-width="1" opacity="0.5"/>
  <text x="400" y="285" font-family="monospace" font-size="13" fill="#E5E7EB" text-anchor="middle">John Bryan Capellan</text>
  <text x="400" y="310" font-family="monospace" font-size="10" fill="#6B7280" text-anchor="middle">has successfully completed</text>
  <text x="400" y="335" font-family="monospace" font-size="11" fill="#9CA3AF" text-anchor="middle">the Introduction to Cybersecurity course</text>
